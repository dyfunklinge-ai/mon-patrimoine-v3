  /* aurora désactivée — on garde le fond noir profond original */
  animation:none !important;
  filter:none !important;
}
@keyframes gx-aurora{
  0%   {transform:translate3d(-1.5%,-1%,0) scale(1.04);opacity:.85}
  35%  {transform:translate3d(1%,.6%,0) scale(1.06);opacity:1}
  70%  {transform:translate3d(2%,-.8%,0) scale(1.05);opacity:.92}
  100% {transform:translate3d(-1%,1%,0) scale(1.03);opacity:.95}
}
body::after{
  background-size:96px 96px !important;
  animation:gx-grid-drift 90s linear infinite;
  will-change:transform;
}
@keyframes gx-grid-drift{to{background-position:96px 96px}}

/* ─────── 3. Cards · smoother lift, deeper shadows ─────── */
.sc,.pcard,.card,.card-sm,.fcard{
  transition:
    transform var(--gx-t-base) var(--gx-expo),
    border-color var(--gx-t-base) var(--gx-expo),
    box-shadow var(--gx-t-base) var(--gx-expo),
    background var(--gx-t-base) var(--gx-expo) !important;
}
@media (hover:hover){
  .sc:hover{
    transform:translate3d(0,-2px,0);
    box-shadow:
      0 8px 20px color-mix(in srgb,var(--ac,var(--cyan)) 10%,transparent),
      0 2px 6px rgba(0,0,0,.5) !important;
  }
  .pcard:hover{
    transform:translate3d(0,-2px,0);
    box-shadow:
      0 18px 48px rgba(0,0,0,.6),
      0 4px 12px rgba(155,122,240,.14),
      inset 0 1px 0 rgba(255,255,255,.05);
  }
  .card-sm:hover{transform:translate3d(0,-1px,0)}
}

/* Hero gets cinematic depth */
.hero{
  box-shadow:var(--gx-d4),
    0 0 80px -28px color-mix(in srgb,var(--ac,var(--cyan)) 35%,transparent) !important;
}
.sc-hero{
  box-shadow:var(--gx-d3),inset 0 1px 0 rgba(255,255,255,.05);
}

/* ─────── 4. Buttons · spring physics + light sweep ─────── */
.btn{
  isolation:isolate;
  transition:
    transform var(--gx-t-fast) var(--gx-spring),
    background var(--gx-t-fast) var(--gx-expo),
    box-shadow var(--gx-t-fast) var(--gx-expo),
    border-color var(--gx-t-fast) var(--gx-expo) !important;
  will-change:transform;
}
/* shimmer désactivé — gardait le bouton trop lumineux */

.btn-p{
  background:linear-gradient(135deg,#5cf5e8 0%,var(--cyan2) 100%) !important;
  box-shadow:
    0 4px 14px -2px rgba(74,244,232,.5),
    0 2px 4px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -1px 0 rgba(0,0,0,.18) !important;
}
.btn-p:hover{
  transform:translate3d(0,-2px,0);
  box-shadow:
    0 8px 24px -2px rgba(74,244,232,.65),
    0 3px 8px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.34) !important;
}
.btn-p:active{transform:translate3d(0,0,0) scale(.97)}
.btn-s:hover{box-shadow:0 0 18px -4px rgba(74,244,232,.35)}
.btn-d:hover{box-shadow:0 0 18px -4px rgba(240,71,108,.4)}

/* ─────── 5. Tabs polish ─────── */
.tab{
  transition:
    color var(--gx-t-fast) var(--gx-snap),
    background var(--gx-t-fast) var(--gx-snap),
    transform var(--gx-t-fast) var(--gx-spring),
    box-shadow var(--gx-t-base) var(--gx-expo) !important;
}
.tab.active{
  box-shadow:
    0 4px 14px -2px color-mix(in srgb,var(--tc,var(--cyan)) 60%,transparent),
    0 2px 4px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(0,0,0,.18),
    0 0 0 1px color-mix(in srgb,var(--tc,var(--cyan)) 28%,transparent) !important;
}

/* ─────── 6. Section transitions · cinematic ─────── */
@keyframes gx-section-in{
  from{opacity:0;transform:translate3d(0,12px,0) scale(.996);filter:blur(2px)}
  to{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}
}
.section.active{animation:gx-section-in .55s var(--gx-expo) !important}

/* ─────── 7. Hero number · luxury gradient ─────── */
.hero-total{
  /* on laisse le style original sombre du nombre — pas de gradient éclairant */
}

/* ─────── 8. Tabular nums on every numeric surface ─────── */
.sc-val,.hero-total,.hero-gain,.pos-pnl,.pos-price,.rval,
.bn-pro-val,.bn-pro-pnl-val,.cal-date-day,.private-val,
.dl-pct,.pb-pct,.pb-perf,td,th{
  font-feature-settings:"tnum" 1,"lnum" 1 !important;
  font-variant-numeric:tabular-nums lining-nums !important;
}

/* ─────── 9. Premium scrollbars ─────── */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.012);border-radius:99px}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,rgba(74,244,232,.20),rgba(155,122,240,.16));
  border-radius:99px;
  border:2px solid transparent;
  background-clip:padding-box;
  transition:background var(--gx-t-fast) ease;
}
::-webkit-scrollbar-thumb:hover{
  background:linear-gradient(180deg,rgba(74,244,232,.4),rgba(155,122,240,.3));
  background-clip:padding-box;
}
::-webkit-scrollbar-corner{background:transparent}

/* ─────── 10. Inputs · neon focus ─────── */
input,select,textarea{
  transition:
    border-color var(--gx-t-fast) var(--gx-expo),
    background var(--gx-t-fast) var(--gx-expo),
    box-shadow var(--gx-t-base) var(--gx-expo) !important;
}
input:focus,select:focus,textarea:focus{
  box-shadow:
    0 0 0 4px rgba(74,244,232,.10),
    0 0 0 1px var(--border-focus),
    0 0 24px -6px rgba(74,244,232,.35) !important;
}

/* ─────── 11. Modals · glass + spring entrance ─────── */
.modal-bg,.confirm-modal-bg{
  -webkit-backdrop-filter:blur(28px) saturate(180%) brightness(.85) !important;
  backdrop-filter:blur(28px) saturate(180%) brightness(.85) !important;
}
.modal-bg.open .mbox,.confirm-modal-bg.open .confirm-modal{
  animation:gx-modal-in .42s var(--gx-spring);
}
@keyframes gx-modal-in{
  from{opacity:0;transform:translate3d(0,16px,0) scale(.96);filter:blur(4px)}
  to{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}
}
.mbox,.confirm-modal{
  box-shadow:
    0 32px 80px rgba(0,0,0,.7),
    0 12px 32px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.06),
    0 0 0 1px rgba(255,255,255,.04) !important;
}

/* ─────── 12. Selection ─────── */
::selection{
  background:linear-gradient(135deg,rgba(74,244,232,.4),rgba(155,122,240,.32));
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.4);
}

.live-dot{
  box-shadow:0 0 0 4px rgba(61,220,151,.18),0 0 16px rgba(61,220,151,.55) !important;
}

/* ─────── 14. Progress bars · shimmer sweep ─────── */
.pb-fill{position:relative;overflow:hidden}
.pb-fill::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
  animation:gx-shimmer 2.6s ease-in-out infinite;
  will-change:transform;
}
@keyframes gx-shimmer{
  0%{transform:translateX(-110%)}
  100%{transform:translateX(110%)}
}

.ch-wrap canvas{transition:none}

/* ─────── 16. Sticky quote bar · cinematic glass ─────── */

    background:rgba(74,244,232,.025) !important;

.tag{letter-spacing:.8px !important;text-shadow:0 1px 1px rgba(0,0,0,.3)}

/* ─────── 19. Donut legend glass ─────── */
.donut-legend{
  background:rgba(255,255,255,.015) !important;

.lock-screen{
  background:
    radial-gradient(ellipse 100% 60% at 50% -10%,rgba(74,244,232,.08),transparent 55%),

    inset 0 2px 8px rgba(74,244,232,.15),

  box-shadow:0 0 16px rgba(74,244,232,.6),0 0 4px rgba(74,244,232,.4) !important;

/* ─────── 21. Health ring · slower easing ─────── */
.health-ring svg circle{
  transition:stroke-dashoffset 1.4s var(--gx-expo) !important;
}

#live-badge{
  transition:all var(--gx-t-base) var(--gx-expo) !important;
}
#live-badge:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 12px -2px rgba(74,244,232,.25);
}
